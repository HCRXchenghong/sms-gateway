{% extends "base.html" %}
{% block title %}首次配置 · 设置账号{% endblock %}
{% block content %}
<div class="card narrow setup-card">
    <h1>首次配置：创建管理员</h1>
    <p class="muted">创建首个管理员后即可进入后台。2FA 默认关闭，可在登录后通过「账号安全」开启。</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
        <label>用户名
            <input type="text" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+">
        </label>
        <label>密码（至少 8 位，同时包含大写和小写字母）
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </label>
        <label>确认密码
            <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit" class="primary">创建账号并进入后台</button>
    </form>
</div>
{% endblock %}
