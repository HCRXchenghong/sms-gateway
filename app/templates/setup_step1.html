{% extends "base.html" %}
{% block title %}首次配置 · 设置账号{% endblock %}
{% block content %}
<div class="card narrow setup-card">
    <h1>首次配置（1/3）：创建管理员</h1>
    <p class="muted">本系统只创建一名管理员。账号和密码由你自己设置，不提供默认首登账号。</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
        <label>用户名
            <input type="text" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+">
        </label>
        <label>密码（至少 6 位，同时包含大写和小写字母）
            <input type="password" name="password" required minlength="6" autocomplete="new-password">
        </label>
        <label>确认密码
            <input type="password" name="password_confirm" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit" class="primary">下一步：绑定 2FA</button>
    </form>
</div>
{% endblock %}
