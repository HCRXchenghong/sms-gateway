{% extends "base.html" %}
{% block title %}首次配置 · 设置账号{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>首次配置（1/3）：创建管理员</h1>
    <p class="muted">本系统仅需创建一名管理员，请妥善保管账号密码。</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
        <label>用户名
            <input type="text" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+">
        </label>
        <label>密码（≥12 位，含字母、数字、特殊字符）
            <input type="password" name="password" required minlength="12" autocomplete="new-password">
        </label>
        <label>确认密码
            <input type="password" name="password_confirm" required minlength="12" autocomplete="new-password">
        </label>
        <button type="submit" class="primary">下一步：绑定 2FA</button>
    </form>
</div>
{% endblock %}
