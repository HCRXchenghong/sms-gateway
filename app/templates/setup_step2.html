{% extends "base.html" %}
{% block title %}首次配置 · 绑定 2FA{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>首次配置（2/3）：绑定 2FA</h1>
    <p>请使用 <b>Microsoft Authenticator</b>（或 Google Authenticator 等任意标准 TOTP App）扫描下方二维码：</p>
    <div class="qr">
        <img src="{{ qr_data_url }}" alt="TOTP QR" width="240" height="240">
    </div>
    <p class="muted">无法扫码时，可手动输入此密钥（Base32）：<code>{{ secret }}</code></p>
    <form method="post" action="/setup/confirm">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <label>请输入 App 当前显示的 6 位验证码完成绑定
            <input type="text" name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code">
        </label>
        <button type="submit" class="primary">确认绑定</button>
    </form>
</div>
{% endblock %}
